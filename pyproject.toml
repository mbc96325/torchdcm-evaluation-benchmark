[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchdcm"
version = "0.1.1"
description = "PyTorch-first discrete choice model estimation with econometric inference."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Baichuan Mo"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "torch>=2.1",
]

[project.optional-dependencies]
bench = [
    "scipy>=1.10",
    "biogeme>=3.2",
    "xlogit>=0.2",
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/mbc96325/torchdcm"
Repository = "https://github.com/mbc96325/torchdcm"
Benchmarks = "https://github.com/mbc96325/torchdcm-evaluation-benchmark"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["torchdcm*"]
